[workspace]
resolver = "2"
members = ["crates/downloader-engine", "crates/app"]

[workspace.package]
version = "0.1.1"
edition = "2021"
license = "MIT"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "stream", "charset", "http2"] }
rusqlite = { version = "0.40", features = ["bundled"] }
governor = "0.10"
uuid = { version = "1", features = ["v4"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
async-trait = "0.1"
arc-swap = "1"
tokio-util = "0.7"
futures-util = "0.3"
url = "2"

[profile.release]
codegen-units = 1
lto = "thin"
strip = true
